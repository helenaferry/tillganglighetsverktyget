services:
  # Oracle Database 23ai Free
  # Note: Use 'latest' (x64) for production servers, 'latest-lite' (ARM) for ARM development
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: tillgang-oracle-prod
    ports:
      - "1521:1521"  # Only database port exposed, no EM
    environment:
      - ORACLE_PWD=${ORACLE_PWD}
      - ORACLE_CHARACTERSET=AL32UTF8
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database/init:/opt/oracle/scripts/startup:ro
      # Mount host timezone to ensure time synchronization
      - /etc/localtime:/etc/localtime:ro
    networks:
      - tillgang-network
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/$$ORACLE_PWD@FREEPDB1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Backend API
  backend-api:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: tillgang-backend-prod
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=oracle-db
      - DB_PORT=1521
      - DB_SERVICE=FREEPDB1
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - tillgang-network
    depends_on:
      oracle-db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Frontend (Nginx)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: tillgang-frontend-prod
    ports:
      - "80:8080"  # Map host port 80 to container port 8080 (non-privileged)
    networks:
      - tillgang-network
    depends_on:
      - backend-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  oracle-data:
    name: tillgang-oracle-data-prod

networks:
  tillgang-network:
    name: tillgang-network-prod
    driver: bridge
