services:
  # Oracle Database Free (gvenzl image – works on Podman/macOS; official image hits ORA-443 on Mac)
  # See https://hub.docker.com/r/gvenzl/oracle-free
  oracle-db:
    image: gvenzl/oracle-free:latest
    container_name: tillgang-oracle-dev
    ports:
      - '1521:1521' # Database port
    shm_size: '2gb'
    environment:
      # gvenzl uses ORACLE_PASSWORD for SYS/SYSTEM; our init script uses ORACLE_PWD
      - ORACLE_PASSWORD=${ORACLE_PWD:-OraclePassword123!}
      - ORACLE_PWD=${ORACLE_PWD:-OraclePassword123!}
      - ORACLE_SID=FREE
      - DB_USER=${DB_USER:-tillgang_user}
      - DB_PASSWORD=${DB_PASSWORD:-TillgangDev2026!}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database/init:/container-entrypoint-initdb.d:ro
    networks:
      - tillgang-network
    healthcheck:
      # Check that app user can connect so backend only starts after init scripts (user + schema) have run
      # Use sqlplus from PATH so healthcheck works across Oracle image versions (23ai, 26ai, etc.)
      test:
        [
          'CMD-SHELL',
          "echo 'SELECT 1 FROM DUAL;' | sqlplus -s $$DB_USER/$$DB_PASSWORD@FREEPDB1 > /dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped

  # Backend API
  backend-api:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: tillgang-backend-dev
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=oracle-db
      - DB_PORT=1521
      - DB_SERVICE=FREEPDB1
      - DB_USER=${DB_USER:-tillgang_user}
      - DB_PASSWORD=${DB_PASSWORD:-TillgangDev2026!}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - EXTERNAL_REQUIREMENTS_URL=${EXTERNAL_REQUIREMENTS_URL:-https://data.arbetsformedlingen.se/accessibility/latest/accessibility-requirements.json}
    volumes:
      - ./server/src:/app/src:ro
      - ./server/package.json:/app/package.json:ro
      # Note: Using tsconfig.container.json from image build (not mounted)
      # to avoid monorepo extends issues
    networks:
      - tillgang-network
    depends_on:
      oracle-db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: tillgang-frontend-dev
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000/api}
    volumes:
      - ./client/app:/app/app
      - ./client/public:/app/public
      - ./client/package.json:/app/package.json:ro
      - ./client/vite.config.ts:/app/vite.config.ts:ro
      - ./client/.env.local:/app/.env.local:ro
      # Note: Using tsconfig.container.json from image build (not mounted)
      # to avoid monorepo extends issues
      - ./client/react-router.config.ts:/app/react-router.config.ts:ro
    networks:
      - tillgang-network
    depends_on:
      - backend-api
    restart: unless-stopped

volumes:
  oracle-data:
    name: tillgang-oracle-data-dev

networks:
  tillgang-network:
    name: tillgang-network-dev
    driver: bridge
