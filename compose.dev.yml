services:
  # Oracle Database 23ai Free
  # Uses ORACLE_IMAGE_TAG env var (default: latest-lite for ARM Mac)
  # For x64 systems (Windows/WSL, Intel Mac, Linux): export ORACLE_IMAGE_TAG=latest
  oracle-db:
    image: container-registry.oracle.com/database/free:${ORACLE_IMAGE_TAG:-latest-lite}
    container_name: tillgang-oracle-dev
    ports:
      - '1521:1521' # Database port
      - '5500:5500' # Enterprise Manager (web UI)
    environment:
      - ORACLE_PWD=${ORACLE_PWD:-OraclePassword123!}
      - ORACLE_CHARACTERSET=AL32UTF8
      - DB_USER=${DB_USER:-tillgang_user}
      - DB_PASSWORD=${DB_PASSWORD:-TillgangDev2026!}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database/init:/opt/oracle/scripts/startup:ro
      # Mount host timezone to ensure time synchronization
      - /etc/localtime:/etc/localtime:ro
    networks:
      - tillgang-network
    healthcheck:
      # Check that app user can connect so backend only starts after init scripts (user + schema) have run
      # Use sqlplus from PATH so healthcheck works across Oracle image versions (23ai, 26ai, etc.)
      test:
        [
          'CMD-SHELL',
          "echo 'SELECT 1 FROM DUAL;' | sqlplus -s $$DB_USER/$$DB_PASSWORD@FREEPDB1 > /dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped

  # Backend API
  backend-api:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: tillgang-backend-dev
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=oracle-db
      - DB_PORT=1521
      - DB_SERVICE=FREEPDB1
      - DB_USER=${DB_USER:-tillgang_user}
      - DB_PASSWORD=${DB_PASSWORD:-TillgangDev2026!}
    volumes:
      - ./server/src:/app/src:ro
      - ./server/package.json:/app/package.json:ro
      # Note: Using tsconfig.container.json from image build (not mounted)
      # to avoid monorepo extends issues
    networks:
      - tillgang-network
    depends_on:
      oracle-db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: tillgang-frontend-dev
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:3000/api
    volumes:
      - ./client/app:/app/app:ro
      - ./client/public:/app/public:ro
      - ./client/package.json:/app/package.json:ro
      - ./client/vite.config.ts:/app/vite.config.ts:ro
      - ./client/.env.local:/app/.env.local:ro
      # Note: Using tsconfig.container.json from image build (not mounted)
      # to avoid monorepo extends issues
      - ./client/react-router.config.ts:/app/react-router.config.ts:ro
    networks:
      - tillgang-network
    depends_on:
      - backend-api
    restart: unless-stopped

volumes:
  oracle-data:
    name: tillgang-oracle-data-dev

networks:
  tillgang-network:
    name: tillgang-network-dev
    driver: bridge
