secret_evaluation:
  needs: [secret_detection]
  artifacts:
    paths:
      - gl-secret-detection-report.json
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache jq
  script:
    - |
      if [ -f "gl-secret-detection-report.json" ]; then
        if [ "$(jq '.vulnerabilities | length' gl-secret-detection-report.json)" -gt 0 ]; then
          echo "🚨 Secrets detected! Failing the job."
          exit 1
        else
          echo "✅ No secrets found."
        fi
      else
        echo "⚠️ Report file missing. Evaluation skipped."
      fi

pages:
  image: node:22
  stage: deploy
  script:
    - npm ci
    - npm run build
    - cp -r build/client/* public/
  artifacts:
    paths:
      - public
  only:
    - main
