<VirtualHost *:*>
  ServerName ${SERVER_NAME}

  KeepAliveTimeout 60
  MaxKeepAliveRequests 0

  OIDCProviderMetadataURL ${PROVIDER_METADATA_URL}
  OIDCClientID ${OIDC_CLIENT_ID}
  OIDCClientSecret ${OIDC_CLIENT_SECRET}
  OIDCCryptoPassphrase ${OIDC_CRYPTO_PASSPHRASE}
  OIDCRedirectURI ${REDIRECT_URI}

  OIDCPKCEMethod S256
  OIDCHTTPTimeoutLong 30
  OIDCHTTPTimeoutShort 30

  OIDCClaimPrefix ciam_
  OIDCCookie tillganglighet_user
  OIDCSessionInactivityTimeout 3600

  OIDCXForwardedHeaders X-Forwarded-Proto X-Forwarded-Host X-Forwarded-Port

  # Set Authorization header for requests to /api/ and /oauth/
  <If "%{REQUEST_URI} =~ m#^/(apis)/#">
    RequestHeader set Authorization "Bearer %{OIDC_access_token}e" env=OIDC_access_token
  </If>

  ProxyPass                     /login !
  ProxyPassReverse              / localhost:3000/
  ProxyPass                     / localhost:3000/

  <Location "/">
    AuthType openid-connect
    Require valid-user
    LogLevel debug
  </Location>
</VirtualHost>